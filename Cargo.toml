[package]
name = "grok-home-assistant"
version = "0.2.0"
edition = "2021"
description = "Home voice assistant powered by the xAI Grok Voice Agent API"
license = "MIT"
authors = ["Aidan Swenson <Swenso44@msu.edu>"]
repository = "https://github.com/Ajsparty/grok-home-assistant"
default-run = "grok-home-assistant"

[lib]
name = "grok_home_assistant"
path = "src/lib.rs"

[[bin]]
name = "grok-home-assistant"
path = "src/main.rs"

[[bin]]
name = "grok-satellite"
path = "src/bin/satellite.rs"
required-features = ["local-audio"]

[features]
default = ["local-audio"]
local-audio = ["dep:cpal"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"
base64 = "0.22"
futures-util = "0.3"
url = "2.5"
reqwest = { version = "0.12", features = ["json"] }
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
http = "1"
sha2 = "0.10"
getrandom = "0.2"
cpal = { version = "0.15", optional = true }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
